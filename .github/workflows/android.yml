name: Android APK

# Builds the Android app (apps/mobile) into an installable APK, without EAS:
# `expo prebuild` generates the native project, Gradle builds it. A tag like
# `v1.0.2` (pushed by `pnpm release:android patch`) attaches the APK to a
# GitHub release of that tag, with the commits since the last release as its
# notes; "Run workflow" builds one as a downloadable artifact.
#
# The app's EXPO_PUBLIC_* values (the Convex and site URLs it talks to) come
# from the repository's Actions variables. The release build is signed with
# the Expo template's debug key, so it's for side-loading and testing, not
# the Play Store.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and tags, for the release notes.
          fetch-depth: 0

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .expo.version apps/mobile/app.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but apps/mobile/app.json says $version. Release with pnpm release:android."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Check the app's settings
        run: |
          for name in EXPO_PUBLIC_CONVEX_URL EXPO_PUBLIC_CONVEX_SITE_URL EXPO_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then echo "::error::Set the $name Actions variable"; exit 1; fi
          done

      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          name="settlr-${GITHUB_REF_NAME//\//-}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: settlr-android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The notes: every commit since the last release that touched the
            # app or the backend it talks to, minus the version bumps.
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log --no-merges --format='- %s' --invert-grep --grep='^Android app [0-9]' \
              "${prev:+$prev..}$GITHUB_REF_NAME" -- apps/mobile packages > notes.md
            if [ -n "$prev" ]; then
              printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
            fi
            gh release create "$GITHUB_REF_NAME" --title "Settlr for Android $GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
