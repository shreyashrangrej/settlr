name: Android APK

# Builds the Android app (apps/mobile) into an installable APK, without EAS:
# `expo prebuild` generates the native project, Gradle builds it. Pushing a
# tag like `v1.0.0` attaches the APK to a GitHub release of that tag; "Run
# workflow" builds one as a downloadable artifact.
#
# The app's EXPO_PUBLIC_* values (the Convex and site URLs it talks to) come
# from the repository's Actions variables. The release build is signed with
# the Expo template's debug key, so it's for side-loading and testing, not
# the Play Store.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Check the app's settings
        run: |
          for name in EXPO_PUBLIC_CONVEX_URL EXPO_PUBLIC_CONVEX_SITE_URL EXPO_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then echo "::error::Set the $name Actions variable"; exit 1; fi
          done

      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          name="settlr-${GITHUB_REF_NAME//\//-}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: settlr-android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Settlr for Android $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
