<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in with email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="settlr.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="scr {{themeCls}}" style="display: flex; flex-direction: column">
  <div class="inset"></div>
  <div class="topbar"><a class="ibtn" href="Welcome.dc.html" aria-label="Back"><i class="ic i-back"></i></a></div>
  <div class="in" style="--i: 1; padding: 12px 24px 0">
    <span class="tile" style="width: 52px; height: 52px; border-radius: 18px; background: var(--accent-soft); color: var(--accent-ink)"><i class="ic i-mail"></i></span>
    <h1 class="title" style="margin-top: 20px">What's your email?</h1>
    <p class="sub" style="margin: 8px 0 0; font-size: 15px; line-height: 22px">We'll send you a 6-digit code. New to Settlr? The same code creates your account.</p>
  </div>
  <div class="field in" style="--i: 2; padding: 28px 24px 0">
    <label for="email">Email</label>
    <input id="email" class="input focus" type="email" value="aarav@example.com" autocomplete="email" style="height: 60px; font-size: 17px">
    <span class="sub" style="font-size: 12.5px">Friends can find you by this address to share a ledger.</span>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 24px 24px; display: flex; flex-direction: column; gap: 12px">
    <a class="btn btn-p wide" href="Verify.dc.html" style="height: 56px">Send code<i class="ic i-arrow-r"></i></a>
    <div style="display: flex; align-items: center; gap: 12px" class="lbl"><span style="flex: 1; height: 1px; background: var(--line)"></span>or<span style="flex: 1; height: 1px; background: var(--line)"></span></div>
    <a class="btn btn-o wide" href="Home.dc.html" style="height: 56px">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"></path><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"></path><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"></path><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"></path></svg>
      Continue with Google
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeCls: this.props.theme === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
