<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settled up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="settlr.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0}a{color:inherit}a:hover{color:inherit}
@keyframes popin{0%{transform:scale(.55)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes strike{from{width:0}to{width:100%}}
@media (prefers-reduced-motion: reduce){.popin,.rings>span,.strike{animation:none!important}}
</style>
</helmet>
<div class="scr {{themeCls}}" style="display: flex; flex-direction: column">
  <div class="inset"></div>
  <div class="topbar"><a class="ibtn" href="Home.dc.html" aria-label="Close"><i class="ic i-x"></i></a></div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 28px; text-align: center">
    <div style="position: relative; width: 120px; height: 120px">
      <span class="rings" style="position: absolute; inset: 0">
        <span style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--owed); animation: ring 2.4s var(--ease) .3s infinite"></span>
        <span style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--owed); animation: ring 2.4s var(--ease) 1.1s infinite"></span>
        <span style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--owed); animation: ring 2.4s var(--ease) 1.9s infinite"></span>
      </span>
      <span class="popin" style="position: absolute; inset: 0; border-radius: 50%; background: var(--owed); color: var(--bg); display: flex; align-items: center; justify-content: center; animation: popin .7s var(--spring) .15s both"><i class="ic i-check" style="width: 56px; height: 56px"></i></span>
    </div>
    <h1 class="disp" style="margin: 36px 0 0; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -.03em">All square with Ananya</h1>
    <p class="sub" style="margin: 10px 0 0; font-size: 15px; line-height: 22px">You paid ₹1,640 today · Paid on UPI.<br>Ananya gets a notification, and both ledgers update.</p>

    <div class="card" style="margin-top: 28px; width: 100%; padding: 16px 18px; display: flex; align-items: center; gap: 12px; text-align: left">
      <span class="av t-rose">AR</span>
      <div class="grow">
        <div class="lbl">Your balance with Ananya</div>
        <div style="margin-top: 3px; display: flex; align-items: center; gap: 8px; font-weight: 800" class="num">
          <span style="position: relative" class="neg">₹1,640<span class="strike" style="position: absolute; left: 0; top: 50%; height: 2px; background: currentColor; width: 100%; animation: strike .5s var(--ease) .7s both"></span></span>
          <i class="ic xs i-arrow-r fnt"></i>
          <span class="badge b-owed" style="height: 26px"><i class="ic xs i-check"></i>settled up</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <a class="btn btn-p wide" href="Home.dc.html" style="height: 56px">Done</a>
    <a class="btn btn-n wide" href="Friend.dc.html">See the ledger</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeCls: this.props.theme === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
