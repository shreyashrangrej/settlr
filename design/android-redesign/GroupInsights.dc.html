<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goa Trip insights</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="settlr.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="scr {{themeCls}}">
  <div class="scroll">
    <div class="inset"></div>
    <div class="topbar">
      <a class="ibtn" href="Group.dc.html" aria-label="Back to Goa Trip"><i class="ic i-back"></i></a>
      <span class="tt"></span>
    </div>
    <div style="padding: 0 20px">
      <div class="sub" style="display: flex; align-items: center; gap: 8px"><span class="tile mono t-orange" style="width: 22px; height: 22px; border-radius: 8px; font-size: 12px">G</span>Goa Trip</div>
      <h1 class="title" style="margin-top: 6px">Insights</h1>
    </div>

    <div class="card in" style="--i: 1; margin: 18px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <div style="padding: 14px 16px"><div class="lbl">Total spent</div><div class="amt" style="font-size: 19px; line-height: 26px; margin-top: 2px">₹38,600</div></div>
      <div style="padding: 14px 16px; box-shadow: inset 1px 0 var(--divider)"><div class="lbl">Your share</div><div class="amt" style="font-size: 19px; line-height: 26px; margin-top: 2px">₹7,720</div></div>
      <div style="padding: 14px 16px; box-shadow: inset 1px 0 var(--divider)"><div class="lbl">Expenses</div><div class="amt" style="font-size: 19px; line-height: 26px; margin-top: 2px">14</div></div>
    </div>

    <div class="card in" style="--i: 2; margin: 14px 16px 0; padding: 18px">
      <h2 class="h" style="font-size: 16px">By category</h2>
      <div style="margin-top: 14px; display: flex; align-items: center; gap: 20px">
        <div role="img" aria-label="Lodging 47%, food 24%, entertainment 12%, transport 11%, groceries 6%" style="width: 136px; height: 136px; flex: none; border-radius: 50%; background: conic-gradient(var(--violet-fg) 0 46.6%, var(--surface) 0 47%, var(--orange-fg) 0 70.8%, var(--surface) 0 71.2%, var(--rose-fg) 0 82.5%, var(--surface) 0 82.9%, var(--blue-fg) 0 93.5%, var(--surface) 0 93.9%, var(--green-fg) 0 99.6%, var(--surface) 0 100%); display: flex; align-items: center; justify-content: center">
          <div style="width: 92px; height: 92px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center"><span class="lbl">Nov</span><span class="amt" style="font-size: 15px">₹38.6k</span></div>
        </div>
        <div class="grow" style="display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; font-weight: 600">
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--violet-fg)"></span><span class="grow">Lodging</span><span class="num">₹18,000</span></div>
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--orange-fg)"></span><span class="grow">Food</span><span class="num">₹9,350</span></div>
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--rose-fg)"></span><span class="grow">Entertainment</span><span class="num">₹4,500</span></div>
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--blue-fg)"></span><span class="grow">Transport</span><span class="num">₹4,250</span></div>
          <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--green-fg)"></span><span class="grow">Groceries</span><span class="num">₹2,500</span></div>
        </div>
      </div>
    </div>

    <div class="card in" style="--i: 3; margin: 14px 16px 0; padding: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 class="h" style="font-size: 16px">Paid vs. share</h2>
        <span style="display: flex; gap: 12px; font-size: 12px; font-weight: 650" class="mut"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent)"></span>Paid</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--dim)"></span>Share</span></span>
      </div>
      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 14px">
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700"><span>Priya</span><span class="num pos">+₹5,150</span></div>
          <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 3px"><span class="gx" style="--i: 0; height: 7px; width: 100%; border-radius: 4px; background: var(--accent)"></span><span class="gx" style="--i: 0; height: 7px; width: 60%; border-radius: 4px; background: var(--dim)"></span></div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700"><span>You</span><span class="num pos">+₹3,410</span></div>
          <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 3px"><span class="gx" style="--i: 1; height: 7px; width: 86%; border-radius: 4px; background: var(--accent)"></span><span class="gx" style="--i: 1; height: 7px; width: 60%; border-radius: 4px; background: var(--dim)"></span></div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700"><span>Meera</span><span class="num neg">−₹2,320</span></div>
          <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 3px"><span class="gx" style="--i: 2; height: 7px; width: 42%; border-radius: 4px; background: var(--accent)"></span><span class="gx" style="--i: 2; height: 7px; width: 60%; border-radius: 4px; background: var(--dim)"></span></div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700"><span>Rohan</span><span class="num neg">−₹2,980</span></div>
          <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 3px"><span class="gx" style="--i: 3; height: 7px; width: 37%; border-radius: 4px; background: var(--accent)"></span><span class="gx" style="--i: 3; height: 7px; width: 60%; border-radius: 4px; background: var(--dim)"></span></div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700"><span>Kabir</span><span class="num neg">−₹3,260</span></div>
          <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 3px"><span class="gx" style="--i: 4; height: 7px; width: 35%; border-radius: 4px; background: var(--accent)"></span><span class="gx" style="--i: 4; height: 7px; width: 60%; border-radius: 4px; background: var(--dim)"></span></div>
        </div>
      </div>
    </div>

    <div class="card in" style="--i: 4; margin: 14px 16px 28px; padding: 18px">
      <h2 class="h" style="font-size: 16px">By month</h2>
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; font-weight: 650">
        <div style="display: flex; align-items: center; gap: 12px"><span style="width: 34px">Nov</span><span class="bar grow" style="height: 10px"><span class="gx" style="width: 100%; background: var(--accent)"></span></span><span class="num" style="width: 64px; text-align: right">₹36,150</span></div>
        <div style="display: flex; align-items: center; gap: 12px"><span style="width: 34px">Oct</span><span class="bar grow" style="height: 10px"><span class="gx" style="--i: 1; width: 7%; background: var(--accent)"></span></span><span class="num" style="width: 64px; text-align: right">₹2,450</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeCls: this.props.theme === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
