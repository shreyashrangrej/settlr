<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settlr — Add expense (web)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#07080A}
a{color:#F2F2EE}a:hover{color:#B18CFF}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:#8A8D96}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; background: #07080A; background-image: radial-gradient(#1A1C21 1px, transparent 1px); background-size: 22px 22px; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; font-size: 14px; display: flex; align-items: flex-start; justify-content: center; padding: 56px 16px">

<div role="dialog" aria-modal="true" aria-labelledby="add-h" style="width: 100%; max-width: 1080px; border-radius: 28px; background: #121317; border: 1px solid #26282F; box-shadow: 0 40px 120px rgba(0,0,0,0.6); overflow: hidden">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid #22242A">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #B18CFF; color: #0C0D10; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 id="add-h" style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.03em">Add an expense</h1>
        <span style="font-size: 13px; color: #A0A2AB">Goes into Flat 4B · 3 members</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div role="tablist" aria-label="How to add" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #0C0D10; border: 1px solid #24262D">
        <button type="button" role="tab" aria-selected="true" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: #2A2C33; font-weight: 600; font-size: 13px; cursor: pointer">Manual</button>
        <button type="button" role="tab" aria-selected="false" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; color: #A0A2AB; cursor: pointer; display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg>
          Scan receipt
        </button>
        <a href="web-assistant.html" role="tab" aria-selected="false" style="min-height: 36px; padding: 0 14px; border-radius: 9px; font-size: 13px; color: #A0A2AB; text-decoration: none; display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B18CFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
          Ask AI
        </a>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 1px solid #24262D; border-radius: 12px; background: transparent; color: #A0A2AB; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: stretch">

    <div style="flex: 3 1 440px; min-width: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px">

      <label style="display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; border-radius: 20px; background: #0C0D10; border: 1px solid #B18CFF">
        <span style="font-size: 12px; color: #A0A2AB">Amount</span>
        <span style="display: flex; align-items: center; gap: 12px">
          <span style="padding: 6px 10px; border-radius: 10px; background: #1D1F25; font-size: 13px; font-weight: 600; color: #D6D7DC">INR ₹</span>
          <input type="text" inputmode="decimal" value="1,860.00" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 44px; font-weight: 500; letter-spacing: -0.04em">
        </span>
      </label>

      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 500; color: #D6D7DC">Description</span>
        <input type="text" value="Pizza night" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #2A2C33; background: #0C0D10; outline: 0; font-size: 15px">
      </label>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #D6D7DC">Category</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #B18CFF; background: rgba(177,140,255,0.12); color: #B18CFF; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"></path><path d="M9 3c0 2 2 2 2 4M14 3c0 2 2 2 2 4"></path></svg>
            Food
          </button>
          <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.5 12h-11z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
            Groceries
          </button>
          <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
            Rent &amp; bills
          </button>
          <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 20 6-11 4 6 3-4 5 9z"></path></svg>
            Travel
          </button>
          <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-2 9H8z"></path><path d="M6 6 5 3H2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>
            Shopping
          </button>
          <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px dashed #33353D; background: transparent; color: #A0A2AB; font-size: 13px; cursor: pointer">+ Custom</button>
        </div>
      </fieldset>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 500; color: #D6D7DC">Date</span>
          <input type="text" value="Today, 13 Oct" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #2A2C33; background: #0C0D10; outline: 0">
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 500; color: #D6D7DC">Group</span>
          <select style="height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid #2A2C33; background: #0C0D10">
            <option>Flat 4B</option>
            <option>Coorg Weekend</option>
            <option>Office Lunch</option>
            <option>No group</option>
          </select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 500; color: #D6D7DC">Paid by</span>
          <select style="height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid #2A2C33; background: #0C0D10">
            <option>You</option>
            <option>Ananya</option>
            <option>Meera</option>
            <option>Multiple people</option>
          </select>
        </label>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
        <button type="button" style="flex: 1 1 240px; min-height: 92px; border: 1.5px dashed #33353D; border-radius: 16px; background: transparent; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left; cursor: pointer">
          <span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: #1D1F25; display: flex; align-items: center; justify-content: center; color: #B18CFF">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-weight: 600">Attach a receipt</span>
            <span style="font-size: 12px; color: #A0A2AB">Drop a photo or PDF. Settlr reads the total and items.</span>
          </span>
        </button>
        <label style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 500; color: #D6D7DC">Note <span style="color: #8A8D96; font-weight: 400">(optional)</span></span>
          <textarea rows="2" placeholder="Add a note for the group" style="flex: 1; min-height: 64px; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 1px solid #2A2C33; background: #0C0D10; outline: 0; resize: none"></textarea>
        </label>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #0C0D10; border: 1px solid #24262D">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600">Repeat this expense</span>
          <span style="font-size: 12px; color: #A0A2AB">Good for rent, Wi-Fi and subscriptions</span>
        </span>
        <button type="button" role="switch" aria-checked="false" aria-label="Repeat this expense" style="width: 52px; height: 30px; border: 0; border-radius: 99px; background: #2A2C33; padding: 3px; display: flex; cursor: pointer">
          <span style="width: 24px; height: 24px; border-radius: 50%; background: #A0A2AB"></span>
        </button>
      </div>
    </div>

    <aside aria-labelledby="split-h" style="flex: 2 1 340px; min-width: 0; box-sizing: border-box; padding: 24px; background: #0F1014; border-left: 1px solid #22242A; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <h2 id="split-h" style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.02em">Split</h2>
        <a href="#" style="font-size: 13px; color: #A0A2AB">+ Add person</a>
      </div>
      <div role="group" aria-label="Split method" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: #16171C; border: 1px solid #24262D">
        <button type="button" aria-pressed="true" style="min-height: 36px; border: 0; border-radius: 9px; background: #2A2C33; font-weight: 600; font-size: 13px; cursor: pointer">Equally</button>
        <button type="button" aria-pressed="false" style="min-height: 36px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; color: #A0A2AB; cursor: pointer">Exact</button>
        <button type="button" aria-pressed="false" style="min-height: 36px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; color: #A0A2AB; cursor: pointer">Percent</button>
        <button type="button" aria-pressed="false" style="min-height: 36px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; color: #A0A2AB; cursor: pointer">Shares</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; border-radius: 14px; background: #16171C; border: 1px solid #24262D; cursor: pointer">
          <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #B18CFF">
          <span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #B18CFF, #7CB8FF); color: #0C0D10; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">AM</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">You</span><span style="font-size: 12px; color: #A0A2AB">paid ₹1,860</span></span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">₹620.00</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; border-radius: 14px; background: #16171C; border: 1px solid #24262D; cursor: pointer">
          <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #B18CFF">
          <span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: #55332A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">AR</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Ananya Rao</span><span style="font-size: 12px; color: #A0A2AB">will owe you</span></span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">₹620.00</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; border-radius: 14px; background: #16171C; border: 1px solid #24262D; cursor: pointer">
          <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #B18CFF">
          <span style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: #4D4326; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">MI</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Meera Iyer</span><span style="font-size: 12px; color: #A0A2AB">will owe you</span></span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">₹620.00</span>
        </label>
      </div>

      <div style="padding: 16px; border-radius: 16px; background: #16171C; border: 1px solid #24262D; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between"><span style="color: #A0A2AB">Total</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">₹1,860.00</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #A0A2AB">Split</span><span>3 ways, equally</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #A0A2AB">You'll get back</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; color: #7CB8FF">₹1,240.00</span></div>
        <div style="height: 1px; background: #24262D"></div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; color: #A0A2AB">Your Flat 4B balance</span>
          <div style="display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 18px; font-weight: 500">
            <span style="color: #FF9B6A">−₹390</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A2AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="becomes" role="img"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <span style="color: #7CB8FF">+₹850</span>
          </div>
        </div>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #D6D7DC; cursor: pointer">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #B18CFF">
        Notify Ananya and Meera
      </label>

      <div style="margin-top: auto; display: flex; gap: 10px">
        <button type="button" style="flex: 1; height: 50px; border: 1px solid #33353D; border-radius: 14px; background: transparent; font-weight: 600; cursor: pointer">Cancel</button>
        <button type="button" style="flex: 2; height: 50px; border: 0; border-radius: 14px; background: #B18CFF; color: #0C0D10; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
          Save expense
          <kbd style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; background: rgba(12,13,16,0.12)">⌘↵</kbd>
        </button>
      </div>
    </aside>
  </div>
</div>
</div>
</body>
</html>
