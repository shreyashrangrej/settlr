<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settlr — Add expense (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F2EE}a:hover{color:#B18CFF}
button,input{font:inherit;color:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0C0D10; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; font-size: 14px">

  <div style="box-sizing: border-box; padding: 56px 18px 0; display: flex; flex-direction: column; gap: 16px">

    <header style="display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px">
      <a href="mobile-home.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #16171C; border: 1px solid #24262D; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
      <h1 style="margin: 0; text-align: center; font-size: 16px; font-weight: 600">New expense</h1>
      <a href="mobile-assistant.html" style="min-height: 44px; padding: 0 12px; border-radius: 99px; background: #16171C; border: 1px solid #24262D; box-sizing: border-box; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 500">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B18CFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
        Ask AI
      </a>
    </header>

    <div style="display: flex; justify-content: center">
      <button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #F28DB2"></span>
        Flat 4B
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <label style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-size: 12px; color: #A0A2AB">Amount</span>
      <span style="display: flex; align-items: baseline; justify-content: center; gap: 4px">
        <span style="font-size: 30px; font-weight: 500; color: #A0A2AB">₹</span>
        <span style="font-size: 64px; font-weight: 600; letter-spacing: -0.06em; line-height: 1">1,860</span>
        <span aria-hidden="true" style="width: 3px; height: 54px; border-radius: 2px; background: #B18CFF; align-self: center"></span>
      </span>
    </label>

    <label style="display: flex; justify-content: center">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Description</span>
      <input type="text" value="Pizza night" style="width: 240px; height: 44px; text-align: center; border: 0; border-bottom: 1px solid #2A2C33; background: transparent; outline: 0; font-size: 17px; font-weight: 500">
    </label>

    <div role="group" aria-label="Category" style="display: flex; gap: 8px; margin-right: -18px">
      <button type="button" aria-pressed="true" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #B18CFF; background: rgba(177,140,255,0.12); color: #B18CFF; font-weight: 600; font-size: 13px; cursor: pointer">Food</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; cursor: pointer">Groceries</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; cursor: pointer">Rent &amp; bills</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; cursor: pointer">Travel</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid #2A2C33; background: transparent; font-size: 13px; cursor: pointer">Shopping</button>
    </div>

    <div style="border-radius: 20px; background: #16171C; border: 1px solid #24262D; padding: 0 14px; display: flex; flex-direction: column">
      <button type="button" style="min-height: 54px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #1D1F25; display: flex; align-items: center; justify-content: center; color: #A0A2AB"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></span>
        <span style="flex: 1; color: #A0A2AB">Paid by</span>
        <span style="font-weight: 600">You</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D96" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
      <button type="button" style="min-height: 54px; border: 0; border-top: 1px solid #22242A; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #1D1F25; display: flex; align-items: center; justify-content: center; color: #A0A2AB"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4 8h7M13 16h7"></path></svg></span>
        <span style="flex: 1; color: #A0A2AB">Split</span>
        <span style="font-weight: 600">Equally · 3 people</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D96" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
      <button type="button" style="min-height: 54px; border: 0; border-top: 1px solid #22242A; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #1D1F25; display: flex; align-items: center; justify-content: center; color: #A0A2AB"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
        <span style="flex: 1; color: #A0A2AB">Date</span>
        <span style="font-weight: 600">Today</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D96" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
      <button type="button" style="min-height: 54px; border: 0; border-top: 1px solid #22242A; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #1D1F25; display: flex; align-items: center; justify-content: center; color: #A0A2AB"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>
        <span style="flex: 1; color: #A0A2AB">Receipt</span>
        <span style="font-weight: 600; color: #B18CFF">Add photo</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D96" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </div>

    <section aria-label="Split preview" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 12px 8px; border-radius: 16px; background: #16171C; border: 1px solid #24262D; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #B18CFF, #7CB8FF); color: #0C0D10; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">AM</span>
        <span style="font-size: 12px; color: #A0A2AB">You</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">₹620</span>
      </div>
      <div style="padding: 12px 8px; border-radius: 16px; background: #16171C; border: 1px solid #24262D; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #55332A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">AR</span>
        <span style="font-size: 12px; color: #A0A2AB">Ananya</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; color: #7CB8FF">₹620</span>
      </div>
      <div style="padding: 12px 8px; border-radius: 16px; background: #16171C; border: 1px solid #24262D; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #4D4326; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">MI</span>
        <span style="font-size: 12px; color: #A0A2AB">Meera</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; color: #7CB8FF">₹620</span>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 18px; right: 18px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; text-align: center; font-size: 12px; color: #A0A2AB">Ananya and Meera will each owe you ₹620</p>
    <button type="button" style="height: 56px; border: 0; border-radius: 18px; background: #B18CFF; color: #0C0D10; font-weight: 600; font-size: 16px; cursor: pointer">Add ₹1,860 to Flat 4B</button>
  </div>
</div>
</body>
</html>
